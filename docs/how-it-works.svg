<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a92"/>
    </marker>
  </defs>
  <rect width="920" height="300" rx="16" fill="#141416"/>

  <!-- input -->
  <rect x="28" y="112" width="128" height="56" rx="10" fill="#26262b" stroke="#38383f"/>
  <text x="92" y="136" fill="#e8e8ea" font-size="15" font-weight="600" text-anchor="middle">input.mp4</text>
  <text x="92" y="156" fill="#8a8a92" font-size="12" text-anchor="middle">hybrid DV / HDR10</text>

  <line x1="156" y1="140" x2="196" y2="140" stroke="#8a8a92" stroke-width="2" marker-end="url(#a)"/>

  <!-- probe -->
  <rect x="200" y="112" width="128" height="56" rx="10" fill="#26262b" stroke="#38383f"/>
  <text x="264" y="136" fill="#e8e8ea" font-size="15" font-weight="600" text-anchor="middle">ffprobe</text>
  <text x="264" y="156" fill="#8a8a92" font-size="12" text-anchor="middle">reads duration</text>

  <line x1="328" y1="140" x2="368" y2="140" stroke="#8a8a92" stroke-width="2" marker-end="url(#a)"/>

  <!-- timeline UI -->
  <rect x="372" y="96" width="188" height="88" rx="10" fill="#26262b" stroke="#3a9440"/>
  <text x="466" y="122" fill="#e8e8ea" font-size="15" font-weight="600" text-anchor="middle">timeline UI</text>
  <text x="466" y="142" fill="#8a8a92" font-size="12" text-anchor="middle">drag handles → pick range</text>
  <!-- mini timeline -->
  <rect x="392" y="154" width="148" height="12" rx="4" fill="#1c1c20"/>
  <rect x="414" y="154" width="86" height="12" fill="#2e7d32"/>
  <rect x="411" y="150" width="6" height="20" rx="2" fill="#66bb6a"/>
  <rect x="497" y="150" width="6" height="20" rx="2" fill="#ef5350"/>

  <!-- preview branch (top) -->
  <line x1="466" y1="96" x2="466" y2="64" stroke="#8a8a92" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="20" width="272" height="44" rx="10" fill="#1e1e22" stroke="#38383f"/>
  <text x="466" y="38" fill="#b8b8c0" font-size="12.5" text-anchor="middle">preview: QtMultimedia playback (hw decode + audio)</text>
  <text x="466" y="55" fill="#8a8a92" font-size="12.5" text-anchor="middle">auto-fallback: ffmpeg frame grab — colors always correct</text>

  <line x1="560" y1="140" x2="600" y2="140" stroke="#8a8a92" stroke-width="2" marker-end="url(#a)"/>

  <!-- trim -->
  <rect x="604" y="104" width="176" height="72" rx="10" fill="#26262b" stroke="#38383f"/>
  <text x="692" y="128" fill="#e8e8ea" font-size="15" font-weight="600" text-anchor="middle">ffmpeg stream copy</text>
  <text x="692" y="148" fill="#8fd694" font-size="12" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle">-ss IN -to OUT</text>
  <text x="692" y="164" fill="#8fd694" font-size="12" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle">-map 0 -c copy</text>

  <line x1="780" y1="140" x2="820" y2="140" stroke="#8a8a92" stroke-width="2" marker-end="url(#a)"/>

  <!-- output -->
  <rect x="824" y="112" width="72" height="56" rx="10" fill="#2e7d32" stroke="#3a9440"/>
  <text x="860" y="145" fill="#f2fff2" font-size="14" font-weight="600" text-anchor="middle">.mp4</text>

  <!-- footnotes -->
  <text x="460" y="222" fill="#b8b8c0" font-size="13" text-anchor="middle">no re-encode → instant, lossless, Dolby Vision / HDR10 metadata and every track kept intact</text>
  <text x="460" y="244" fill="#8a8a92" font-size="12.5" text-anchor="middle">cuts snap to the keyframe at/before the in-point · Options → Frame-accurate re-encodes for exact cuts (drops DV)</text>
  <text x="460" y="278" fill="#5a5a62" font-size="11.5" text-anchor="middle">mp4trim pipeline</text>
</svg>
